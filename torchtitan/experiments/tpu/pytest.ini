[pytest]
# --import-mode=importlib: Handles same-named test files in different directories
# --forked: Runs each test in a separate process to avoid PJRT re-initialization issues
addopts = --import-mode=importlib --forked --strict-markers

# Search recursively for tests
python_files = test_*.py *_test.py
python_classes = *Test
python_functions = test_*

# Exclude directories
norecursedirs = .git __pycache__ .pytest_cache

# Filter common warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore:.*multi-threaded, use of fork\(\) may lead to deadlocks:DeprecationWarning
