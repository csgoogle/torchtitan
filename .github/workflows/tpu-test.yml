name: TPU CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:  # Cancel older jobs for the same PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  tpu-tests:
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          # Temporarily disabling v6e tests as it is blocking torch_tpu queue
          # {
          #   runner: "linux-x86-ct6e-180-8tpu",
          #   bazel_config: "ci_tpu_on_v6",
          # },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            bazel_config: "ci_tpu_on_v7",
          }
        ]
        test_shard: [core_1, core_2, kernels, graph, models_1, models_2]
    runs-on: ${{ matrix.job_info.runner }}
    timeout-minutes: 30

    # 1. ADD NATIVE CONTAINER DEFINITION HERE WITH AUTHENTICATION
    container:
      image: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container@sha256:707a5f592a81d3d64f3700d4c423ecc8aa9ae33fab4516008d3a5ae8d9c9c117
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      # Pass your specific Docker flags here. 
      # (GitHub Actions automatically handles mounting the workspace, so we removed those flags)
      options: --privileged --net host

    # 2. SET ENVIRONMENT VARIABLES FOR THE JOB
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      # 3. RUN TESTS IN PARALLEL SHARDS
      - name: Run Core Distributed Tests 1
        if: matrix.test_shard == 'core_1'
        run: |
          set -e
          ulimit -n 65536
          python -m torchtitan.experiments.tpu.tests.test_train_distributed --device=tpu
          python -m torchtitan.experiments.tpu.tests.test_model_distributed --device=tpu

      - name: Run Core Distributed Tests 2
        if: matrix.test_shard == 'core_2'
        run: |
          set -e
          ulimit -n 65536
          python -m torchtitan.experiments.tpu.tests.test_train_minimal_distributed --device=tpu
          python -m torchtitan.experiments.tpu.tests.test_dtensor --device=tpu

      - name: Run Kernel & Integration Tests
        if: matrix.test_shard == 'kernels'
        run: |
          set -e
          ulimit -n 65536
          # python -m torchtitan.experiments.tpu.kernels.tests.test_splash_attention --device=tpu
          # python -m torchtitan.experiments.tpu.kernels.tests.test_tokamax_splash_attention --device=tpu
          # python -m torchtitan.experiments.tpu.kernels.tests.test_linear_softmax_cross_entropy_loss --device=tpu
          # python -m torchtitan.experiments.tpu.kernels.tests.test_gmm --device=tpu
          # python -m torchtitan.experiments.tpu.kernels.tests.test_fill_indices --device=tpu
          # python -m torchtitan.experiments.tpu.kernels.tests.test_segment_matmul --device=tpu

      - name: Run Graph Trainer & Optimizer Tests
        if: matrix.test_shard == 'graph'
        run: |
          set -e
          ulimit -n 65536
          python -m torchtitan.experiments.tpu.graph_trainer.tests.test_tpu_graph_trainer_unit --device=tpu
          python -m torchtitan.experiments.tpu.graph_trainer.tests.test_tpu_graph_trainer_distributed --device=tpu
          python -m torchtitan.experiments.tpu.compiled_optimizers.tests.test_separate_graph --device=tpu

      - name: Run Model Specific Tests (Qwen3, Llama3)
        if: matrix.test_shard == 'models_1'
        run: |
          set -e
          ulimit -n 65536
          # Temporarily disable due to test_qwen_full_model_training_steps_cpu_device_parity tolerance failure
          # python -m torchtitan.experiments.tpu.qwen3.tests.test_qwen3 --device=tpu
          python -m torchtitan.experiments.tpu.qwen3.tests.test_dtensor_parallelize --device=tpu
          python -m torchtitan.experiments.tpu.llama3.tests.test_llama3 --device=tpu
          python -m torchtitan.experiments.tpu.llama3.tests.test_dtensor_parallelize --device=tpu

      - name: Run Model Specific Tests (redacted, DeepSeek V3)
        if: matrix.test_shard == 'models_2'
        run: |
          set -e
          ulimit -n 65536
          python -m torchtitan.experiments.tpu.redacted.tests.test_redacted --device=tpu
          python -m torchtitan.experiments.tpu.redacted.tests.test_simple_fsdp --device=tpu
          python -m torchtitan.experiments.tpu.redacted.tests.test_dtensor_parallelize --device=tpu
          # python -m torchtitan.experiments.tpu.redacted.tests.test_kernels --device=tpu
          python -m torchtitan.experiments.tpu.redacted.tests.test_train_minimal_distributed --device=tpu
          python -m torchtitan.experiments.tpu.deepseek_v3.tests.test_dtensor_parallelize --device=tpu