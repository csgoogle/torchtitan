name: TPU CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: 'Container image to run the suite in. Defaults to :latest.'
        required: false
        type: string
    secrets:
      GAR_JSON_KEY:
        description: 'Service account key used to pull the test image from GAR'
        required: true

concurrency:  # Cancel older jobs for the same PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          test_matrix=$(python .ci/discover_tpu_tests.py)
          echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"

  # Picks the image the suite runs in: :latest, or, when this change edits the
  # image's dependencies, an image rebuilt from them. See .ci/tpu_image/.
  resolve-image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      image: ${{ steps.pick.outputs.image || steps.build-ref.outputs.image }}
    defaults:
      run:
        shell: bash
    env:
      IMAGE_REPO: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container
    steps:
      - name: Checkout repository
        if: ${{ !inputs.image }}
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          # Full history so the commit :latest was built from can be diffed.
          fetch-depth: 0
          persist-credentials: false

      - name: Log in to GAR
        if: ${{ !inputs.image }}
        env:
          GAR_JSON_KEY: ${{ secrets.GAR_JSON_KEY }}
        run: echo "${GAR_JSON_KEY}" | docker login -u _json_key --password-stdin https://us-west1-docker.pkg.dev

      - name: Pick image
        id: pick
        env:
          INPUT_IMAGE: ${{ inputs.image }}
        run: |
          if [[ -n "${INPUT_IMAGE}" ]]; then
            echo "Using caller-provided image ${INPUT_IMAGE}"
            echo "image=${INPUT_IMAGE}" >> "${GITHUB_OUTPUT}"
          else
            .ci/tpu_image/pick_image.sh
          fi

      # :latest is ~7GB unpacked and the rebuild is as large again, which is
      # more than a stock runner's free disk; drop preinstalled toolchains.
      - name: Free disk space
        if: ${{ steps.pick.outputs.build == 'true' }}
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af
          df -h /

      - name: Extract torch_tpu wheel and tokenizers from :latest
        id: base
        if: ${{ steps.pick.outputs.build == 'true' }}
        env:
          BASE_REF: ${{ steps.pick.outputs.base_ref }}
        run: .ci/tpu_image/extract_base.sh "${BASE_REF}"

      - name: Setup Docker Buildx
        if: ${{ steps.pick.outputs.build == 'true' }}
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3

      - name: Build and push image with this change's dependencies
        id: build
        if: ${{ steps.pick.outputs.build == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: torchtitan/experiments/tpu/Dockerfile
          push: true
          tags: ${{ steps.pick.outputs.deps_tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=torchtitan-tpu-deps
            org.opencontainers.image.base.name=${{ steps.pick.outputs.base_ref }}
          build-args: |
            PYTHON_VERSION=${{ steps.base.outputs.python_version }}
            TORCH_VERSION=${{ steps.base.outputs.torch_version }}

      - name: Reference built image by digest
        id: build-ref
        if: ${{ steps.pick.outputs.build == 'true' }}
        env:
          DEPS_TAG: ${{ steps.pick.outputs.deps_tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          echo "image=${IMAGE_REPO}@${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Test image: \`${DEPS_TAG}\` (rebuilt for changed dependencies)" >> "${GITHUB_STEP_SUMMARY}"

  distributed-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards[0] != null }}
    needs: [setup-matrix, resolve-image]
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards }}
    runs-on: linux-x86-tpu7x-224-4tpu
    timeout-minutes: 30

    container:
      image: ${{ needs.resolve-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module --device=tpu || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  single-tpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards[0] != null }}
    needs: [setup-matrix, resolve-image]
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards }}
    runs-on: linux-x86-tpu7x-56-1tpu
    timeout-minutes: 30

    container:
      image: ${{ needs.resolve-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module --device=tpu || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  cpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards[0] != null }}
    needs: [setup-matrix, resolve-image]
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ needs.resolve-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    env:
      PYTHONDONTWRITEBYTECODE: 1
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
      # Stops libtpu querying the GCP metadata server for TPU topology. This
      # prevents a 10 minute 404 retry loop for tests importing torch_tpu that
      # run on CPU only.
      TPU_SKIP_MDS_QUERY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  pytest-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).pytest_shards[0] != null }}
    needs: [setup-matrix, resolve-image]
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).pytest_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ needs.resolve-image.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    env:
      PYTHONDONTWRITEBYTECODE: 1
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
      # Stops libtpu querying the GCP metadata server for TPU topology. This
      # prevents a 10 minute 404 retry loop for tests importing torch_tpu that
      # run on CPU only.
      TPU_SKIP_MDS_QUERY: 1
      # Per-test disables from .ci/discover_tpu_tests.py (DESELECTED_TESTS).
      PYTEST_DESELECT: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).pytest_deselect }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for test_file in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test file: $test_file"
            echo "=================================================="
            # Unquoted on purpose: one --deselect=<node-id> word per test.
            # shellcheck disable=SC2086
            timeout 900 python -m pytest -v "$test_file" $PYTEST_DESELECT || failed="$failed $test_file"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi
