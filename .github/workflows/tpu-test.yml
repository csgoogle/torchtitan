name: TPU CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:  # Cancel older jobs for the same PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          test_matrix=$(python .ci/discover_tpu_tests.py)
          echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"

  distributed-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards }}
    runs-on: linux-x86-tpu7x-224-4tpu
    timeout-minutes: 30

    container:
      image: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container:latest # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            python -m $module --device=tpu
          done

  single-tpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards }}
    runs-on: linux-x86-tpu7x-56-1tpu
    timeout-minutes: 30

    container:
      image: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container:latest # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            python -m $module --device=tpu
          done

  cpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container:latest # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            python -m $module
          done