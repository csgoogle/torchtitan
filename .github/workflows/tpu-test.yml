name: TPU CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:  # Cancel older jobs for the same PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          test_matrix=$(python .ci/discover_tpu_tests.py)
          echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"

  tpu-tests:
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        job_info: [
          # Temporarily disabling v6e tests as it is blocking torch_tpu queue
          # {
          #   runner: "linux-x86-ct6e-180-8tpu",
          #   bazel_config: "ci_tpu_on_v6",
          # },
          {
            runner: "linux-x86-tpu7x-224-4tpu",
            bazel_config: "ci_tpu_on_v7",
          }
        ]
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix) }}
    runs-on: ${{ matrix.job_info.runner }}
    timeout-minutes: 30

    # 1. ADD NATIVE CONTAINER DEFINITION HERE WITH AUTHENTICATION
    container:
      image: us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container:latest
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      # Pass your specific Docker flags here. 
      # (GitHub Actions automatically handles mounting the workspace, so we removed those flags)
      options: --privileged --net host

    # 2. SET ENVIRONMENT VARIABLES FOR THE JOB
    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      # 3. RUN TESTS IN PARALLEL SHARDS
      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            python -m $module --device=tpu
          done