name: TPU CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  workflow_call:
    inputs:
      image:
        description: 'Container image to run the suite in. Defaults to :latest.'
        required: false
        type: string
    secrets:
      GAR_JSON_KEY:
        description: 'Service account key used to pull the test image from GAR'
        required: true

concurrency:  # Cancel older jobs for the same PR
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      test_matrix: ${{ steps.set-matrix.outputs.test_matrix }}
      # Callers may pass an image; push/pull_request runs get no inputs at all,
      # so fall back to :latest here rather than in each job.
      image: ${{ inputs.image || 'us-west1-docker.pkg.dev/tpu-pytorch/torchtitan-images/torchtitan-container:latest' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Generate Matrix
        id: set-matrix
        run: |
          test_matrix=$(python .ci/discover_tpu_tests.py)
          echo "test_matrix=${test_matrix}" >> "$GITHUB_OUTPUT"

  distributed-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).distributed_shards }}
    runs-on: linux-x86-tpu7x-224-4tpu
    timeout-minutes: 30

    container:
      image: ${{ needs.setup-matrix.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module --device=tpu || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  single-tpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).single_tpu_shards }}
    runs-on: linux-x86-tpu7x-56-1tpu
    timeout-minutes: 30

    container:
      image: ${{ needs.setup-matrix.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}
      options: --privileged --net host

    env:
      PYTHONDONTWRITEBYTECODE: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup TPU Compilation Cache Symlink
        run: |
          mkdir -p /tmp/torch_tpu_cache
          ln -sfn /tmp/torch_tpu_cache /dev/shm/torch_tpu_cache

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module --device=tpu || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  cpu-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).cpu_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ needs.setup-matrix.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    env:
      PYTHONDONTWRITEBYTECODE: 1
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
      # Stops libtpu querying the GCP metadata server for TPU topology. This
      # prevents a 10 minute 404 retry loop for tests importing torch_tpu that
      # run on CPU only.
      TPU_SKIP_MDS_QUERY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for module in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test module: $module"
            echo "=================================================="
            timeout 900 python -m $module || failed="$failed $module"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi

  pytest-tests:
    if: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).pytest_shards[0] != null }}
    needs: setup-matrix
    strategy:
      fail-fast: false
      matrix:
        test_shard: ${{ fromJson(needs.setup-matrix.outputs.test_matrix).pytest_shards }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    container:
      image: ${{ needs.setup-matrix.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: _json_key
        password: ${{ secrets.GAR_JSON_KEY }}

    env:
      PYTHONDONTWRITEBYTECODE: 1
      TORCH_DEVICE_BACKEND_AUTOLOAD: 0
      # Stops libtpu querying the GCP metadata server for TPU topology. This
      # prevents a 10 minute 404 retry loop for tests importing torch_tpu that
      # run on CPU only.
      TPU_SKIP_MDS_QUERY: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Run Sharded Tests
        run: |
          set -e
          ulimit -n 65536
          failed=""
          for test_file in ${{ matrix.test_shard.modules }}; do
            echo "=================================================="
            echo "Running test file: $test_file"
            echo "=================================================="
            timeout 900 python -m pytest -v "$test_file" || failed="$failed $test_file"
          done

          if [ -n "$failed" ]; then
            echo "=================================================="
            echo "Failed test target(s):"
            for target in $failed; do
              echo "::error::$target failed"
            done
            exit 1
          fi
