name: Rerun TPU CI Infra Failures

# Rerun TPU CI (up to 3 attempts) when every failed job died in the k8s
# "Initialize containers" step, before any test ran.
on:
  workflow_run:  # zizmor: ignore[dangerous-triggers] -- no checkout; only reads job metadata of the triggering run.
    workflows: ["TPU CI Pipeline"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Rerun if every failed job failed during container init
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          failed_steps=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | [.steps[] | select(.conclusion == "failure") | .name][0] // "<none>"')
          echo "First failed step per failed job:"
          echo "$failed_steps"
          if [ -z "$failed_steps" ] || echo "$failed_steps" | grep -qvx 'Initialize containers'; then
            echo "Not all failures are container init failures; not rerunning."
            exit 0
          fi
          echo "::warning::Rerunning failed jobs of run $RUN_ID (attempt $RUN_ATTEMPT) after container init failures"
          gh run rerun "$RUN_ID" --failed
